<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  color-scheme: dark;
  --bg: #090C0F;
  --surface: #0B1014;
  --card: #0D1419;
  --card-hover: #10181E;
  --border: #1A252D;
  --border-hover: #26343D;
  --rule: #172127;
  --text: #F1F4F6;
  --text-2: #98A5AE;
  --muted: #687680;
  --very-muted: #4F5D66;
  --accent: #3DDC97;
  --accent-hover: #6BE7B1;
  --accent-ink: #06140D;
  --accent-wash: rgba(61, 220, 151, 0.10);
  --accent-line: rgba(61, 220, 151, 0.30);
  --focus: #8FB4FF;
  /* Green strength: "subtle" is the default. */
  --glow: radial-gradient(70% 70% at 50% 40%, rgba(61, 220, 151, 0.22), transparent 70%);
  --nav-on: #0F1A15;
  --count: var(--text);
  --rel-dot: transparent;
  --card-hover-border: var(--accent-line);
  --sans: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 12px/1.55 var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
::selection { background: rgba(61, 220, 151, 0.28); color: var(--text); }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; }
.icon { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

body[data-green="rich"] {
  --glow: radial-gradient(80% 80% at 50% 38%, rgba(61, 220, 151, 0.30), transparent 72%);
  --nav-on: #10231A;
  --count: var(--accent);
  --rel-dot: var(--accent);
}
body[data-green="rich"] .hero::before {
  content: ""; position: absolute; left: -40px; top: -40px; width: 520px; height: 360px; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, rgba(61, 220, 151, 0.10), transparent);
}
body[data-green="rich"] .card:hover .co { color: var(--accent); }
body[data-green="rich"] .tabs button[aria-selected="true"] { color: var(--accent); }

/* Sidebar */
.side { position: fixed; inset: 0 auto 0 0; width: 170px; background: var(--bg); border-right: 1px solid var(--rule); padding: 24px 12px; }
.logo { display: flex; align-items: center; gap: 10px; padding-inline: 6px; }
.logo svg { width: 22px; height: 20px; flex: none; }
.logo span { font-size: 10px; font-weight: 600; letter-spacing: 0.18em; line-height: 1.25; color: #E8EDF0; }
.nav { display: grid; gap: 2px; margin-top: 42px; }
.nav a { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 6px; font-size: 11px; color: #7F8B94; transition: color 150ms ease, background-color 150ms ease; }
.nav a:hover { color: var(--text); }
.nav a[aria-current] { background: var(--nav-on); color: var(--text); }
.nav a[aria-current] .icon { color: var(--accent); }
.logo svg { color: var(--accent); }

/* Main */
.main { margin-left: 170px; overflow-x: clip; }
.inner { max-width: 1120px; margin: 0 auto; padding: 24px 40px 72px; }
.top { display: flex; justify-content: flex-end; }
.search { display: flex; align-items: center; gap: 8px; width: 270px; height: 32px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; color: var(--muted); transition: border-color 150ms ease; }
.search:hover { border-color: var(--border-hover); }
.search:focus-within { border-color: var(--border-hover); outline: 1.5px solid var(--focus); outline-offset: 2px; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 10px; color: var(--text); }
.search input::placeholder { color: var(--muted); }
.search .icon { width: 14px; height: 14px; }

/* Hero */
.hero { position: relative; isolation: isolate; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 36px; margin-top: 8px; min-height: 260px; }
.photo { position: relative; align-self: end; width: 280px; height: 250px; border-radius: 4px; overflow: hidden; background: #0C1115; }
.photo::before { content: ""; position: absolute; inset: 0; background: var(--glow); pointer-events: none; z-index: 1; }
.photo .ph { z-index: 2; }
.photo img, .photo canvas { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.photo .ph { position: absolute; left: 10px; bottom: 8px; font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--very-muted); }
.info { align-self: center; padding-block: 16px 20px; max-width: 560px; }
.sport { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #74828C; }
.name { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 32px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.05; color: #F3F6F8; }
.name svg { width: 14px; height: 14px; color: #5DA9FF; }
.team { margin-top: 6px; font-size: 12px; color: #8996A0; }
.tagline { margin-top: 16px; font-size: 14px; font-weight: 500; color: #E7ECEF; letter-spacing: -0.01em; }
.desc { margin-top: 6px; max-width: 470px; font-size: 11px; line-height: 1.6; color: #87949D; }
.meta { display: flex; align-items: center; gap: 24px; margin-top: 20px; }
.meta .rule { width: 1px; height: 28px; background: #1C252C; }
.meta b { display: block; font-size: 15px; font-weight: 500; color: var(--text); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.meta span { display: block; margin-top: 2px; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.org { position: absolute; top: 20px; right: 0; text-align: right; }
.org b { display: block; font-size: 32px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; color: #DCE4E8; }
.org span { display: block; margin-top: 6px; font-size: 7px; letter-spacing: 0.14em; text-transform: uppercase; color: #596771; }

/* Tabs */
.tabs { display: flex; gap: 28px; height: 42px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.tabs button { position: relative; border: 0; background: none; padding: 0; font-size: 11px; color: #71808A; cursor: pointer; transition: color 150ms ease; }
.tabs button:hover { color: var(--text-2); }
.tabs button[aria-selected="true"] { color: #EAF2F6; cursor: default; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.tabs button[aria-disabled="true"] { cursor: default; }

/* Portfolio */
.portfolio { margin-top: 26px; }
.portfolio h2 { font-size: 18px; font-weight: 500; letter-spacing: -0.02em; color: #EFF3F5; }
.portfolio .sub { margin-top: 6px; font-size: 11px; color: #75828C; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.card {
  display: flex; flex-direction: column; height: 142px; padding: 15px; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  transition: background-color 150ms ease, border-color 150ms ease;
}
.card:hover { background: var(--card-hover); border-color: var(--card-hover-border); }
.meta div:first-child b { color: var(--count); }
.card-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 32px; height: 32px; flex: none; border-radius: 8px; display: grid; place-items: center; background: #E7ECEF; color: #0B1014; font-size: 10px; font-weight: 600; letter-spacing: -0.01em; }
.card-top div { min-width: 0; }
.mark.has-logo { background: #fff; overflow: hidden; }
.mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
.co { display: block; font-size: 12px; font-weight: 500; color: #E7ECEF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat { display: block; margin-top: 1px; font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card p { margin-top: 12px; font-size: 10px; line-height: 1.5; color: #87949D; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.yr { font-size: 10px; color: #6F7C85; font-variant-numeric: tabular-nums; }
.rel { display: inline-flex; align-items: center; gap: 6px; font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; color: #7D8A93; }
.rel::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--rel-dot); }

/* Company sheet (opens from a card) */
.scrim { position: fixed; inset: 0; background: rgba(5, 7, 9, 0.6); opacity: 0; pointer-events: none; transition: opacity 160ms ease; z-index: 40; }
.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 41; overflow-y: auto;
  background: var(--surface); border-left: 1px solid var(--border); padding: 24px;
  transform: translateX(16px); opacity: 0; pointer-events: none;
  transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1), opacity 160ms ease;
}
.open .scrim { opacity: 1; pointer-events: auto; }
.open .sheet { transform: none; opacity: 1; pointer-events: auto; }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head .mark { width: 40px; height: 40px; font-size: 12px; }
.sheet-head h3 { font-size: 18px; font-weight: 500; letter-spacing: -0.02em; }
.sheet-head .cat { font-size: 10px; }
.close { margin-left: auto; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text-2); cursor: pointer; transition: color 150ms ease, border-color 150ms ease; }
.close:hover { color: var(--text); border-color: var(--border-hover); }
.sheet .lede { margin-top: 16px; font-size: 11px; line-height: 1.6; color: #87949D; }
.rows { margin-top: 20px; border-top: 1px solid var(--rule); }
.rows div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 11px; }
.rows dt { color: var(--muted); }
.rows dd { margin: 0; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
.rows .un { color: var(--muted); }
.rows a { color: var(--accent); }
.rows a:hover { color: var(--accent-hover); }
.also { margin-top: 24px; }
.also h4 { margin: 0; font-size: 9px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.also ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
.also li { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 10px; margin-inline: -10px; border-radius: 6px; font-size: 11px; color: var(--text-2); }
.also li button { all: unset; cursor: pointer; color: var(--accent); }
.also li button:hover { color: var(--accent-hover); }
.also li:has(button):hover { background: var(--accent-wash); }
.also .note { font-size: 10px; color: var(--very-muted); }

/* Mobile top bar */
.mbar { display: none; }

/* Preview chrome (not part of the design) */
.preview { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: rgba(13, 20, 25, 0.92); white-space: nowrap; }
.preview span { padding: 0 8px 0 10px; font-size: 10px; color: var(--muted); }
.preview button { border: 0; background: none; cursor: pointer; padding: 6px 10px; border-radius: 999px; font-size: 10px; color: var(--text-2); }
.preview button[aria-pressed="true"] { background: #1A252D; color: var(--text); }
.preview .sep { width: 1px; height: 16px; padding: 0; margin: 0 4px; background: var(--border); }

@media (max-width: 1100px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hero { grid-template-columns: 240px minmax(0, 1fr); }
  .photo { width: 240px; height: 230px; }
}
@media (max-width: 850px) {
  .side { display: none; }
  .main { margin-left: 0; }
  .mbar { display: flex; align-items: center; justify-content: space-between; height: 54px; padding: 0 20px; border-bottom: 1px solid var(--rule); position: relative; }
  .mbar .menu { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: none; color: var(--text-2); cursor: pointer; }
  .mbar nav { position: absolute; top: 54px; left: 0; right: 0; z-index: 20; padding: 8px 12px 12px; background: var(--bg); border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
  .inner { padding: 20px 24px 64px; }
  .top { justify-content: stretch; }
  .search { width: 100%; }
  .hero { grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
  .photo { align-self: start; }
  .info { padding-block: 0 24px; }
  .org { top: 0; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .inner { padding: 16px 16px 64px; }
  .photo { width: 100%; height: 200px; }
  .name { font-size: 26px; }
  .org { display: none; }
  .meta { gap: 12px 20px; flex-wrap: wrap; }
  .meta .rule { display: none; }
  .grid { grid-template-columns: 1fr; }
  .preview .lbl, .preview .sep { display: none; }
  .preview { left: 8px; right: 8px; transform: none; overflow-x: auto; justify-content: flex-start; }
  .preview button { padding: 6px 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

        <span class="card-top">${mark(h)}<span><span class="co">${esc(h.co)}</span><span class="cat">${esc(h.cat)}</span></span></span>
        <p>${esc(h.about)}</p>
        <span class="card-foot"><span class="yr">${h.year || 'Undisclosed'}</span><span class="rel">${esc(rel(h))}</span></span>
      </button>`).join('');
    document.title = `${a.name} · Athlete Portfolio`;
    document.querySelectorAll('#pv button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.slug === slug)));
    requestAnimationFrame(drawPhoto);
  }

  // Company sheet
  const body = document.body, sheet = document.getElementById('sheet');
  let opener = null;
  function openSheet(i, from) {
    const h = current.holdings[i];
    opener = from;
    const others = h.others.filter(n => n !== current.name);
    sheet.innerHTML = `
      <div class="sheet-head">
        ${mark(h)}
        <div><h3 id="sheet-title">${esc(h.co)}</h3><span class="cat">${esc(h.cat)}</span></div>
        <button type="button" class="close" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <p class="lede">${esc(h.about)}</p>
      <dl class="rows">
        <div><dt>Relationship</dt><dd>${esc(rel(h))}</dd></div>
        <div><dt>Year</dt><dd>${h.year || '<span class="un">Undisclosed</span>'}</dd></div>
        <div><dt>Round</dt><dd>${h.round ? esc(h.round) : '<span class="un">Undisclosed</span>'}</dd></div>
        <div><dt>Amount</dt><dd>${h.amount ? esc(h.amount) : '<span class="un">Undisclosed</span>'}</dd></div>
        <div><dt>Source</dt><dd><a href="${esc(h.src)}" target="_blank" rel="noopener">${esc(host(h.src))}</a></dd></div>
      </dl>
      <div class="also">
        <h4>Also backed by</h4>
        ${others.length ? `<ul>${others.map(n => SLUG[n]
          ? `<li><button type="button" data-go="${SLUG[n]}">${esc(n)}</button><span class="note">View profile</span></li>`
          : `<li><span>${esc(n)}</span></li>`).join('')}</ul>`
          : '<ul><li><span class="note">No other athletes on record yet.</span></li></ul>'}
      </div>`;
    body.classList.add('open');
    sheet.focus();
  }
  function closeSheet() {
    body.classList.remove('open');
    if (opener && document.contains(opener)) opener.focus();
  }
  document.getElementById('grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openSheet(+c.dataset.i, c); });
  document.getElementById('scrim').addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => {
    if (e.target.closest('.close')) return closeSheet();
    const go = e.target.closest('[data-go]');
    if (go) { body.classList.remove('open'); render(go.dataset.go); window.scrollTo(0, 0); document.getElementById('hero').querySelector('.name').focus?.(); }
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && body.classList.contains('open')) closeSheet(); });

  // Mobile menu
  const menuBtn = document.querySelector('.mbar .menu'), mnav = document.getElementById('mnav');
  menuBtn.addEventListener('click', () => { const on = mnav.hidden; mnav.hidden = !on; menuBtn.setAttribute('aria-expanded', String(on)); });

  // Preview switcher
  document.getElementById('pv').innerHTML = Object.entries(ATHLETES).map(([k, v]) => `<button type="button" data-slug="${k}" aria-pressed="false">${esc(v.name)}</button>`).join('');
  document.getElementById('pv').addEventListener('click', e => { const b = e.target.closest('[data-slug]'); if (b) render(b.dataset.slug); });

  // Neutral placeholder: a quiet, rim-lit studio silhouette. No glow, no colour.
  function drawPhoto() {
    const cv = document.getElementById('photo'); if (!cv) return;
    const dpr = Math.min(devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    cv.width = w * dpr; cv.height = h * dpr;
    const c = cv.getContext('2d'); c.scale(dpr, dpr);
    const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#11181D'); g.addColorStop(1, '#0A0E11');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    const s = h / 250, cx = w * 0.52, top = h - 250 * s;
    const head = new Path2D(); head.ellipse(cx, top + 92 * s, 38 * s, 48 * s, 0, 0, Math.PI * 2);
    const torso = new Path2D();
    torso.moveTo(cx - 20 * s, top + 120 * s);
    torso.bezierCurveTo(cx - 22 * s, top + 158 * s, cx - 46 * s, top + 170 * s, cx - 112 * s, top + 190 * s);
    torso.bezierCurveTo(cx - 146 * s, top + 200 * s, cx - 156 * s, top + 228 * s, cx - 160 * s, top + 260 * s);
    torso.lineTo(cx + 160 * s, top + 260 * s);
    torso.bezierCurveTo(cx + 156 * s, top + 228 * s, cx + 146 * s, top + 200 * s, cx + 112 * s, top + 190 * s);
    torso.bezierCurveTo(cx + 46 * s, top + 170 * s, cx + 22 * s, top + 158 * s, cx + 20 * s, top + 120 * s);
    torso.closePath();
    const rim = c.createLinearGradient(cx - 80 * s, 0, cx + 120 * s, 0);
    rim.addColorStop(0, 'rgba(241,244,246,0)'); rim.addColorStop(1, 'rgba(241,244,246,0.28)');
    for (const p of [torso, head]) {
      c.fillStyle = '#0E1418'; c.fill(p);
      c.save(); c.clip(p); c.strokeStyle = rim; c.lineWidth = 3 * s; c.stroke(p); c.restore();
    }
  }
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawPhoto, 120); });

  // Green strength toggle (preview only)
  const gBtns = [...document.querySelectorAll('[data-g]')];
  const setG = g => { document.body.dataset.green = g; gBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === g))); try { localStorage.setItem('ap-green', g); } catch (e) {} };
  gBtns.forEach(b => b.addEventListener('click', () => setG(b.dataset.g)));
  let g0 = 'subtle'; try { g0 = localStorage.getItem('ap-green') || 'subtle'; } catch (e) {}
  setG(g0);

  let start = 'kevin-durant';
  const hash = location.hash.slice(1);
  if (ATHLETES[hash]) start = hash;
  render(start);
})();
</script>
