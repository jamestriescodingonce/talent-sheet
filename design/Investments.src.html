<title>Talent Sheet Investments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
/* Layout: app frame (icon rail + top bar) holding a title, a describe-search row, filter chips and a dense deals table. */
@font-face{font-family:"Violet Sans";src:__FONT__;font-weight:400;font-style:normal;font-display:swap}
:root{
  --accent:#9ae230;--accent-ink:#0a1204;--accent-soft:rgba(154,226,48,.12);
  --bg:#05080a;--black:#000;--card:#0d1613;--surface2:#101915;--surface3:#16211c;
  --text:#eaf1ec;--muted:#8b9a92;--faint:#5c6a63;
  --line:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.12);
  --ease:cubic-bezier(.23,1,.32,1);
  --font-head:"Bricolage Grotesque",system-ui,sans-serif;
  --font-body:"Violet Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:400;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding:16px}
h1,h2,h3,b,strong,th,button,input,select{font-weight:400}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* frame */
.frame{display:grid;grid-template-columns:64px minmax(0,1fr);background:var(--card);border-radius:28px;box-shadow:0 0 0 1px var(--line),0 32px 64px -32px rgba(0,0,0,.8);overflow:hidden;max-width:1600px;margin:0 auto;min-height:calc(100vh - 32px)}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;background:var(--surface2);border-right:1px solid var(--line)}
.mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:16px;margin-bottom:18px}
.rb{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background-color 150ms ease,color 150ms ease,scale 160ms var(--ease);position:relative}
.rb:active{scale:.96}
.rb[aria-current=page]{background:var(--black);color:var(--accent)}
@media (hover:hover) and (pointer:fine){.rb:not([aria-current=page]):hover{background:var(--surface3);color:var(--text)}}
.rb::after{content:"";position:absolute;inset:-2px}
.rail .gap{flex:1}
.me{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-head);font-weight:700;margin-top:8px}
.main{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;height:56px;padding:0 20px;border-bottom:1px solid var(--line)}
.bar .ib{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background-color 150ms ease,color 150ms ease}
@media (hover:hover) and (pointer:fine){.bar .ib:hover{background:var(--surface2);color:var(--text)}}
.crumb{color:var(--muted);display:flex;gap:10px;align-items:center}
.crumb i{width:1px;height:14px;background:var(--line-strong)}
.gsearch{margin-left:auto;display:flex;align-items:center;gap:8px;width:min(300px,45%);height:38px;border-radius:12px;background:var(--surface2);box-shadow:0 0 0 1px var(--line);padding:0 8px 0 14px;color:var(--faint);border:0;text-align:left;transition:box-shadow 150ms ease}
.gsearch span{flex:1}
@media (hover:hover) and (pointer:fine){.gsearch:hover{box-shadow:0 0 0 1px var(--line-strong)}}
.kbd{font-size:11px;color:var(--muted);background:var(--card);border-radius:6px;padding:2px 6px;box-shadow:0 0 0 1px var(--line)}

.page{padding:22px 24px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
h1{font-family:var(--font-head);font-weight:700;font-size:40px;letter-spacing:-.025em;line-height:1.05;margin:0;text-wrap:balance}

/* controls row */
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.describe{position:relative;flex:1 1 380px;max-width:640px;display:flex;align-items:center;height:48px;border-radius:14px;background:var(--surface2);box-shadow:0 0 0 1px var(--line);padding:0 6px 0 16px;transition:box-shadow 150ms ease}
.describe:focus-within{box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
.describe input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:14.5px}
.describe input::placeholder{color:var(--faint)}
.spark{width:38px;height:36px;border-radius:10px;border:0;background:var(--surface3);color:var(--muted);display:grid;place-items:center;transition:background-color 150ms ease,color 150ms ease,scale 160ms var(--ease)}
.spark:active{scale:.96}
.describe:focus-within .spark,.spark.ready{background:var(--accent);color:var(--accent-ink)}
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:14px;border:0;background:var(--surface2);box-shadow:0 0 0 1px var(--line);color:var(--muted);transition:background-color 150ms ease,color 150ms ease,scale 160ms var(--ease),box-shadow 150ms ease;touch-action:manipulation}
.btn:active{scale:.96}
.btn[aria-expanded=true]{color:var(--text);box-shadow:0 0 0 1px var(--line-strong)}
@media (hover:hover) and (pointer:fine){.btn:hover{color:var(--text);background:var(--surface3)}}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 3px var(--card)}
.grow{flex:1}
.seg{display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--surface2);box-shadow:0 0 0 1px var(--line)}
.seg button{width:40px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background-color 150ms ease,color 150ms ease,scale 160ms var(--ease)}
.seg button:active{scale:.96}
.seg button[aria-pressed=true]{background:var(--black);color:var(--accent)}
@media (hover:hover) and (pointer:fine){.seg button[aria-pressed=false]:hover{color:var(--text);background:var(--surface3)}}
.seg .sep{width:1px;background:var(--line);margin:6px 3px}

/* popovers */
.pop{position:relative}
.menu{position:absolute;z-index:20;top:calc(100% + 8px);left:0;min-width:260px;background:var(--surface2);border-radius:16px;box-shadow:0 0 0 1px var(--line-strong),0 24px 48px -12px rgba(0,0,0,.7);padding:6px;transform-origin:top left;animation:pop 160ms var(--ease)}
.menu.right{left:auto;right:0;transform-origin:top right}
@keyframes pop{from{opacity:0;scale:.97}}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 12px;border:0;border-radius:10px;background:transparent;text-align:left;color:var(--text)}
.mi .chk{margin-left:auto;color:var(--accent);opacity:0}
.mi[aria-checked=true] .chk{opacity:1}
@media (hover:hover) and (pointer:fine){.mi:hover{background:var(--surface3)}}
.fp{width:min(340px,86vw);padding:14px;display:flex;flex-direction:column;gap:14px}
.fp h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{height:32px;padding:0 12px;border-radius:9px;border:0;background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--muted);transition:background-color 150ms ease,color 150ms ease,scale 160ms var(--ease);touch-action:manipulation}
.opt:active{scale:.96}
.opt[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 1px rgba(154,226,48,.35)}
@media (hover:hover) and (pointer:fine){.opt[aria-pressed=false]:hover{color:var(--text);background:var(--surface3)}}
.fp .row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:4px}
.link{border:0;background:transparent;color:var(--muted);padding:6px 4px}
@media (hover:hover) and (pointer:fine){.link:hover{color:var(--text)}}
.opts.inds{max-height:132px;overflow:auto}

/* chips row */
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:38px}
.fc{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 14px;border-radius:12px;background:var(--surface2);box-shadow:0 0 0 1px var(--line);color:var(--muted)}
.fc b{color:var(--text)}
.fc button{width:22px;height:22px;border-radius:7px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;transition:background-color 150ms ease,color 150ms ease}
.fc button::after{content:"";position:absolute;inset:-8px}
.fc button{position:relative}
@media (hover:hover) and (pointer:fine){.fc button:hover{background:var(--surface3);color:var(--text)}}
.ghost{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;border:0;background:transparent;box-shadow:0 0 0 1px var(--line);color:var(--muted);transition:color 150ms ease,background-color 150ms ease}
@media (hover:hover) and (pointer:fine){.ghost:hover{color:var(--text);background:var(--surface2)}}
.summary{color:var(--muted);margin-right:6px}
.summary b{color:var(--text)}

/* table */
.tw{border-top:1px solid var(--line);min-width:0}
.scroller{overflow:auto;max-height:min(70vh,820px);min-height:360px;scrollbar-color:var(--surface3) transparent}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px}
th{position:sticky;top:0;z-index:2;background:var(--card);text-align:left;color:var(--muted);font-size:14.5px;padding:0 14px;height:60px;white-space:nowrap;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
th:last-child,td:last-child{border-right:0}
th.first{left:0;z-index:3;padding-left:24px}
td{padding:0 14px;height:64px;white-space:nowrap;vertical-align:middle;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--card);transition:background-color 120ms ease}
td.first{position:sticky;left:0;z-index:1;padding-left:24px}
.row{cursor:pointer}
.row[aria-expanded=true] td{background:var(--surface2)}
@media (hover:hover) and (pointer:fine){.row:hover td{background:var(--surface2)}}
.co{display:flex;align-items:center;gap:14px;min-width:230px}
.plus{width:16px;color:var(--faint);flex:none;transition:rotate 200ms var(--ease),color 150ms ease}
.row[aria-expanded=true] .plus{rotate:45deg;color:var(--accent)}
.logo{width:34px;height:34px;border-radius:50%;background:#fff;flex:none;display:grid;place-items:center;overflow:hidden;outline:1px solid oklch(1 0 0 / .1);outline-offset:-1px;position:relative}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.logo.fb{font-family:var(--font-head);font-weight:600;font-size:14px;color:var(--text)}
.logo.sm{width:20px;height:20px;font-size:10px}
.cn{font-family:var(--font-head);font-weight:600;font-size:15px;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.fade{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tags{display:flex;gap:6px;max-width:200px}
.tag{display:inline-flex;height:30px;align-items:center;padding:0 12px;border-radius:9px;background:var(--surface2);color:var(--muted);box-shadow:0 0 0 1px var(--line);flex:none}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:9px;background:var(--surface2);box-shadow:0 0 0 1px var(--line)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.round{color:var(--muted)}
.money{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.money.est::before{content:"~";margin-right:2px;opacity:.8}
.dim{color:var(--faint)}
.achips{display:flex;gap:6px;align-items:center;min-width:250px}
.achip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 5px;border-radius:9px;background:var(--surface2);box-shadow:0 0 0 1px var(--line);max-width:170px}
.achip span:last-child{overflow:hidden;text-overflow:ellipsis}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;color:var(--text);flex:none}
.more{color:var(--muted);padding-left:2px}
.site{display:inline-flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;position:relative}
.site .ar{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--surface2);color:var(--muted);transition:background-color 150ms ease,color 150ms ease}
@media (hover:hover) and (pointer:fine){.site:hover .ar{background:var(--black);color:var(--accent)}}
.site::after{content:"";position:absolute;inset:-10px -4px}
.detail td{padding:0;height:auto;background:var(--bg);white-space:normal;border-right:0}
.din{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;padding:16px 24px 18px 68px;position:sticky;left:0;width:min(calc(100vw - 130px),1180px);animation:in 200ms var(--ease)}
@keyframes in{from{opacity:0;translate:0 -4px}}
.dc{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 0 0 1px var(--line);min-width:0}
.dc h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.ln{display:flex;justify-content:space-between;gap:14px;padding:3px 0;color:var(--muted)}
.ln b{color:var(--text);text-align:right}
.dc a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.empty{padding:72px 16px;text-align:center;color:var(--muted)}
.empty td{border:0}
.foot{color:var(--faint);font-size:12px;padding:12px 24px 18px;margin:0}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;background:var(--black);color:var(--text);padding:10px 16px;border-radius:12px;box-shadow:0 0 0 1px var(--line-strong),0 16px 32px rgba(0,0,0,.6);animation:in 200ms var(--ease);z-index:50}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media (max-width:720px){
  body{padding:8px}
  .frame{grid-template-columns:minmax(0,1fr);border-radius:20px}
  .rail{display:none}
  .page{padding:18px 16px 16px}
  h1{font-size:32px}
  .bar{padding:0 14px}
  .gsearch{width:auto;flex:1}
  .seg{display:none}
  th.first,td.first{padding-left:16px}
}
</style>

<div class="frame">
  <nav class="rail" aria-label="Primary" id="rail"></nav>
  <div class="main">
    <div class="bar">
      <button class="ib" aria-label="Toggle sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
      <div class="crumb"><i></i><span>Investments</span></div>
      <button class="gsearch" id="gs"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span><span class="kbd" style="flex:none">⌘ K</span></button>
    </div>
    <div class="page">
      <h1>Investments</h1>
      <div class="controls">
        <form class="describe" id="describe" role="search">
          <input id="q" type="text" placeholder="Describe the deals you want, e.g. ownership deals since 2024" autocomplete="off" aria-label="Describe the deals you want">
          <button class="spark" id="spark" type="submit" aria-label="Apply search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.5l-1.9-5.7L4.5 10.9 10.1 9z"/><path d="M19 3v3M17.5 4.5h3"/></svg></button>
        </form>
        <div class="pop" id="fpop"></div>
        <div class="pop" id="spop"></div>
        <span class="grow"></span>
        <div class="seg" id="views" role="group" aria-label="View"></div>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="tw"><div class="scroller"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></div>
    <p class="foot">Amounts marked ~ are estimated or implied. Athlete stake is the athlete's own amount; round size and valuation are for the company round. Industry comes from Airtable where set, and is inferred from the company name otherwise. Logos from Logo.dev.</p>
  </div>
</div>

<script>
const DATA=__DATA__;
const LOGOS=__LOGOS__;
const IND_INFER=__IND__;
const TYPE={"Capital Investment":"Investment","Equity":"Investment","Franchise Ownership":"Ownership","Brand Ambassador":"Ambassador","Brand Ambassador/Equity":"Ambassador","Executive Stake":"Executive"};
const TYPE_COLOR={Investment:"#9ae230",Ownership:"#5ab0ff",Ambassador:"#f5a25d",Executive:"#c68bff",Unclassified:"#5c6a63"};
const TYPES=["Investment","Ownership","Ambassador","Executive"];
const AV=["#1f3a2c","#243447","#3b2d1f","#33244a","#2b3a2b","#40262e"];
const MONO=["#22402c","#1f3550","#4a3320","#3b2a55","#2d4a3f","#552b36"];

// rows: [athlete, company, date, types, stake, roundSize, valuation, confidence, round, source]
const groups=new Map();
DATA.rows.forEach(r=>{
  const [ath,co,date,types,stake,size,val,conf,round,src]=r;
  const cls=(types||"").split(",").map(t=>TYPE[t]).filter(Boolean);
  const key=[co,date,round,cls[0]||""].join("|");
  let g=groups.get(key);
  if(!g)g=groups.set(key,{co,date,round,type:cls[0]||"Unclassified",size,val,conf,ath:[],stake:null,srcs:[]}).get(key);
  g.ath.push({name:ath,stake});
  if(src&&!g.srcs.includes(src))g.srcs.push(src);
  if(stake)g.stake=(g.stake||0)+stake;
  if(size&&!g.size)g.size=size;if(val&&!g.val)g.val=val;
  if(conf&&conf!=="Undisclosed")g.conf=conf;
});
const ALL=[...groups.values()].map((g,i)=>{
  const at=DATA.ind[g.co];
  return {...g,id:i,ind:at?[at]:(IND_INFER[g.co]||[]),domain:DATA.dom[g.co]||null,disclosed:!!(g.stake||g.size||g.val),year:g.date?+g.date.slice(0,4):0};
});
const INDUSTRIES=[...new Set(ALL.flatMap(g=>g.ind))].sort();
const YEARS=[2024,2025,2026];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{if(n==null)return null;const a=Math.abs(n);
  if(a>=1e9)return "$"+(n/1e9).toFixed(a>=1e10?1:2).replace(/\.?0+$/,"")+"B";
  if(a>=1e6)return "$"+(n/1e6).toFixed(a>=1e8?0:1).replace(/\.0$/,"")+"M";
  if(a>=1e3)return "$"+Math.round(n/1e3)+"K";return "$"+n};
const fmtDate=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",year:"numeric"}):null;
const initials=n=>n.replace(/\(.*\)/,"").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const hash=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);
const avBg=n=>AV[Math.abs(hash(n))%AV.length];

const I=(d,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON={
  grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  deals:'<path d="M4 19V5"/><path d="M4 19h16"/><path d="m8 14 3.5-3.5 3 2.5L20 7"/>',
  users:'<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3 3-4.5 5.5-4.5s4.900 1.500 5.500 4.500"/><path d="M15.500 5.500a3 3 0 0 1 0 6M17.500 14.800c1.600.600 2.700 2 3 4.200"/>',
  bldg:'<rect x="5" y="3.500" width="10" height="17" rx="1.500"/><path d="M15 9h4v11.500h-4M8.500 7.500h3M8.500 11h3M8.500 14.500h3"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  bookmark:'<path d="M6.500 4h11a1 1 0 0 1 1 1v15l-6.500-4-6.500 4V5a1 1 0 0 1 1-1z"/>',
  bell:'<path d="M6 16.500V11a6 6 0 0 1 12 0v5.500l1.500 1.500h-15z"/><path d="M10 20.500a2 2 0 0 0 4 0"/>',
  code:'<path d="m9 7-5 5 5 5M15 7l5 5-5 5"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9M4 12h3M11 12h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/><circle cx="9" cy="12" r="0"/>',

  eye:'<path d="M2.500 12C4 9.500 7.500 6 12 6s8 3.500 9.500 6c-1.500 2.500-5 6-9.500 6s-8-3.500-9.500-6z"/><circle cx="12" cy="12" r="3"/>',

  table:'<rect x="4" y="5" width="16" height="14" rx="2.500"/><path d="M4 10h16M9.500 10v9"/>'
};
$("#rail").innerHTML=`<div class="mark">T</div>`+
 [["grid","Overview"],["deals","Investments","page"],["users","Athletes"],["bldg","Companies"]].map(([i,l,c])=>`<button class="rb" aria-label="${l}" title="${l}" ${c?'aria-current="page"':''}>${I(ICON[i],20)}</button>`).join("")+
 `<span style="height:14px"></span>`+
 [["list","Lists"],["bookmark","Saved"]].map(([i,l])=>`<button class="rb" aria-label="${l}" title="${l}">${I(ICON[i],20)}</button>`).join("")+
 `<span class="gap"></span>`+
 [["bell","Alerts"],["code","API"]].map(([i,l])=>`<button class="rb" aria-label="${l}" title="${l}">${I(ICON[i],20)}</button>`).join("")+`<div class="me">J</div>`;

const state={view:"deals",f:{types:[],inds:[],min:0,disc:false,since:0,text:[]},sort:{deals:"date",athletes:"count"},open:new Set(),menu:null,showChips:true,q:""};
const SORTS={
  deals:[["date","Newest first"],["date-asc","Oldest first"],["stake","Athlete stake, high to low"],["size","Round size, high to low"],["val","Valuation, high to low"],["co","Company, A to Z"],["ath","Most athletes"]],
  athletes:[["count","Most deals"],["total","Total stake, high to low"],["latest","Latest deal"],["name","Name, A to Z"]]
};
const MINS=[[0,"Any"],[1e5,"$100K+"],[1e6,"$1M+"],[1e7,"$10M+"],[5e7,"$50M+"]];

// describe-search parsing: deal type words, "over $10M", "since 2024", everything else matches text
const TYPE_WORDS={invest:"Investment",investment:"Investment",investments:"Investment",investing:"Investment",ownership:"Ownership",franchise:"Ownership",owns:"Ownership",owner:"Ownership",ambassador:"Ambassador",ambassadors:"Ambassador",endorsement:"Ambassador",executive:"Executive",exec:"Executive",board:"Executive"};
const STOP=new Set(["deal","deals","with","in","by","the","a","an","of","athlete","athletes","and","for","that","show","me","all","from","to"]);
function parse(s){
  let t=(" "+s.toLowerCase()+" "),out={types:[],min:0,since:0,text:[]};
  t=t.replace(/(?:over|above|more than|at least|min(?:imum)?|>)\s*\$?\s*(\d+(?:\.\d+)?)\s*(k|m|b)?\b/,(m,n,u)=>{out.min=+n*({k:1e3,m:1e6,b:1e9}[u]||1);return " "});
  t=t.replace(/(?:since|after|from|in)\s+(20\d\d)/,(m,y)=>{out.since=+y;return " "});
  t.split(/[\s,]+/).filter(Boolean).forEach(w=>{
    const ty=TYPE_WORDS[w];if(ty){if(!out.types.includes(ty))out.types.push(ty)}else if(!STOP.has(w))out.text.push(w)});
  return out;
}
function hay(g){return (g.co+" "+g.ath.map(a=>a.name).join(" ")+" "+g.ind.join(" ")+" "+(g.round||"")+" "+g.type).toLowerCase()}
function filtered(){
  const F=state.f,live=state.q.trim()?parse(state.q):{types:[],min:0,since:0,text:[]};
  const types=[...F.types,...live.types],min=Math.max(F.min,live.min),since=Math.max(F.since,live.since),text=[...F.text,...live.text];
  return ALL.filter(g=>(!types.length||types.includes(g.type))
    &&(!F.inds.length||g.ind.some(i=>F.inds.includes(i)))
    &&(!min||(g.stake||0)>=min)&&(!F.disc||g.disclosed)&&(!since||g.year>=since)
    &&(!text.length||text.every(w=>hay(g).includes(w))));
}
const cmpNum=(a,b,dir=-1)=>{if(a==null&&b==null)return 0;if(a==null)return 1;if(b==null)return -1;return (a-b)*dir};
function sortDeals(rows){
  const k=state.sort.deals;
  const f={date:(a,b)=>cmpNum(a.date?Date.parse(a.date):null,b.date?Date.parse(b.date):null,-1),
    "date-asc":(a,b)=>cmpNum(a.date?Date.parse(a.date):null,b.date?Date.parse(b.date):null,1),
    stake:(a,b)=>cmpNum(a.stake,b.stake),size:(a,b)=>cmpNum(a.size,b.size),val:(a,b)=>cmpNum(a.val,b.val),
    co:(a,b)=>a.co.localeCompare(b.co),ath:(a,b)=>b.ath.length-a.ath.length}[k];
  return rows.sort((a,b)=>f(a,b)||a.co.localeCompare(b.co));
}
function byAthlete(rows){
  const m=new Map();
  rows.forEach(g=>g.ath.forEach(a=>{let e=m.get(a.name);if(!e)e=m.set(a.name,{name:a.name,deals:[],total:0}).get(a.name);e.deals.push({g,stake:a.stake});if(a.stake)e.total+=a.stake}));
  const list=[...m.values()];list.forEach(e=>{e.latest=e.deals.reduce((x,d)=>d.g.date&&d.g.date>x?d.g.date:x,"")});
  const k=state.sort.athletes;
  list.sort((a,b)=>({count:b.deals.length-a.deals.length,total:b.total-a.total,latest:b.latest.localeCompare(a.latest),name:0}[k]||0)||a.name.localeCompare(b.name));
  return list;
}

function logo(co,domain,sm){
  const u=domain&&(LOGOS[domain]||null),c=MONO[Math.abs(hash(co))%MONO.length],ch=(co.replace(/[^A-Za-z0-9]/g,"")[0]||"?").toUpperCase();
  const cls="logo"+(sm?" sm":"");
  if(u)return `<span class="${cls}"><img src="${u}" alt="" width="${sm?20:34}" height="${sm?20:34}" data-co="${esc(co)}"></span>`;
  return `<span class="${cls} fb" style="background:${c}">${ch}</span>`;
}
function amt(v,g,accent){
  if(v==null)return `<span class="dim">—</span>`;
  const est=g.conf&&g.conf.startsWith("Estimated");
  return accent?`<span class="money num ${est?"est":""}">${fmt(v)}</span>`:`<span class="num">${est?"~":""}${fmt(v)}</span>`;
}
function achips(g){
  const s=g.ath.slice(0,2),ex=g.ath.length-s.length;
  return `<div class="achips">${s.map(a=>`<span class="achip"><span class="av" style="background:${avBg(a.name)}">${initials(a.name)}</span><span>${esc(a.name)}</span></span>`).join("")}${ex>0?`<span class="more num">+${ex}</span>`:""}</div>`;
}
function detail(g,cols){
  return `<tr class="detail"><td colspan="${cols}"><div class="din">
   <div class="dc"><h3>Athletes</h3>${g.ath.map(a=>`<div class="ln"><b>${esc(a.name)}</b><span class="num">${a.stake?fmt(a.stake):"—"}</span></div>`).join("")}</div>
   <div class="dc"><h3>Deal</h3><div class="ln"><span>Type</span><b>${g.type}</b></div><div class="ln"><span>Round</span><b>${g.round?esc(g.round):"—"}</b></div><div class="ln"><span>Date</span><b>${fmtDate(g.date)||"—"}</b></div></div>
   <div class="dc"><h3>Round numbers</h3><div class="ln"><span>Round size</span><b class="num">${fmt(g.size)||"—"}</b></div><div class="ln"><span>Valuation</span><b class="num">${fmt(g.val)||"—"}</b></div><div class="ln"><span>Confidence</span><b>${g.conf||"Undisclosed"}</b></div></div>
   ${g.srcs.length?`<div class="dc"><h3>Sources</h3>${g.srcs.map(s=>`<div class="ln"><a href="${esc(s)}" target="_blank" rel="noopener">${esc(new URL(s).hostname.replace(/^www\./,""))}</a></div>`).join("")}</div>`:""}
  </div></td></tr>`;
}

const DEAL_COLS=["Company","Industry","Deal type","Latest round","Athlete stake","Athletes","Date","Website"];
const ATH_COLS=["Athlete","Deals","Companies","Deal types","Total stake","Latest deal"];
function renderTable(rows){
  const deals=state.view==="deals",cols=deals?DEAL_COLS:ATH_COLS;
  $("#head").innerHTML=cols.map((c,i)=>`<th scope="col" class="${i===0?"first":""}">${c}</th>`).join("");
  const body=$("#body");
  if(deals){
    const list=sortDeals(rows.slice());
    if(!list.length){body.innerHTML=`<tr class="empty"><td colspan="${cols.length}" class="empty">No deals match. Clear a filter or change the description.</td></tr>`;return list.length}
    body.innerHTML=list.map(g=>{const o=state.open.has("d"+g.id);return `<tr class="row" tabindex="0" data-k="d${g.id}" aria-expanded="${o}">
      <td class="first"><div class="co">${I(ICON.plus,16).replace("<svg","<svg class=\"plus\"")}${logo(g.co,g.domain)}<span class="cn">${esc(g.co)}</span></div></td>
      <td>${g.ind.length?`<div class="tags fade">${g.ind.map(i=>`<span class="tag">${esc(i)}</span>`).join("")}</div>`:`<span class="dim">—</span>`}</td>
      <td><span class="pill"><i style="--c:${TYPE_COLOR[g.type]}"></i>${g.type}</span></td>
      <td class="round">${g.round?esc(g.round):`<span class="dim">—</span>`}</td>
      <td>${g.stake!=null?amt(g.stake,g,true):(g.conf==="Undisclosed"||!g.disclosed?`<span class="dim">Undisclosed</span>`:`<span class="dim">—</span>`)}</td>
      <td>${achips(g)}</td>
      <td class="round num">${fmtDate(g.date)||`<span class="dim">—</span>`}</td>
      <td>${g.domain?`<a class="site" href="https://${g.domain}" target="_blank" rel="noopener" aria-label="Open ${esc(g.co)} website">${g.domain}<span class="ar">${I(ICON.arrow,13)}</span></a>`:`<span class="dim">—</span>`}</td>
    </tr>${o?detail(g,cols.length):""}`}).join("");
    return list.length;
  }
  const list=byAthlete(rows);
  if(!list.length){body.innerHTML=`<tr class="empty"><td colspan="${cols.length}" class="empty">No athletes match. Clear a filter or change the description.</td></tr>`;return 0}
  body.innerHTML=list.map(e=>{const o=state.open.has("a"+e.name),types=[...new Set(e.deals.map(d=>d.g.type))];
    const cos=[...new Set(e.deals.map(d=>d.g.co))];
    return `<tr class="row" tabindex="0" data-k="a${esc(e.name)}" aria-expanded="${o}">
      <td class="first"><div class="co">${I(ICON.plus,16).replace("<svg","<svg class=\"plus\"")}<span class="av" style="width:34px;height:34px;font-size:12px;background:${avBg(e.name)}">${initials(e.name)}</span><span class="cn">${esc(e.name)}</span></div></td>
      <td class="num">${e.deals.length}</td>
      <td><div class="achips" style="min-width:240px">${cos.slice(0,2).map(c=>`<span class="achip">${logo(c,DATA.dom[c],true)}<span>${esc(c)}</span></span>`).join("")}${cos.length>2?`<span class="more num">+${cos.length-2}</span>`:""}</div></td>
      <td><div class="tags fade" style="max-width:260px">${types.map(t=>`<span class="pill"><i style="--c:${TYPE_COLOR[t]}"></i>${t}</span>`).join("")}</div></td>
      <td>${e.total?`<span class="money num">${fmt(e.total)}</span>`:`<span class="dim">—</span>`}</td>
      <td class="round num">${fmtDate(e.latest)||`<span class="dim">—</span>`}</td>
    </tr>${o?`<tr class="detail"><td colspan="${cols.length}"><div class="din">${e.deals.map(d=>`<div class="dc"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">${logo(d.g.co,d.g.domain,true)}<b>${esc(d.g.co)}</b></div><div class="ln"><span>Type</span><b>${d.g.type}</b></div><div class="ln"><span>Round</span><b>${d.g.round?esc(d.g.round):"—"}</b></div><div class="ln"><span>Stake</span><b class="num">${d.stake?fmt(d.stake):"—"}</b></div><div class="ln"><span>Date</span><b>${fmtDate(d.g.date)||"—"}</b></div></div>`).join("")}</div></td></tr>`:""}`}).join("");
  return list.length;
}
function activeChips(){
  const F=state.f,c=[];
  if(F.types.length)c.push(["types","Deal type",F.types.join(", ")]);
  if(F.inds.length)c.push(["inds","Industry",F.inds.join(", ")]);
  if(F.min)c.push(["min","Min athlete stake",fmt(F.min)]);
  if(F.since)c.push(["since","Since",F.since]);
  if(F.disc)c.push(["disc","Amounts","Disclosed only"]);
  F.text.forEach((t,i)=>c.push(["text:"+i,"Matches",t]));
  return c;
}
function renderChips(n){
  const c=activeChips();
  const btn=`<button class="ghost" id="hide">${I(state.showChips?ICON.eyeoff:ICON.eye,16)}${state.showChips?"Hide filters":"Show filters"}</button>`;
  const deals=new Set(filtered().flatMap(g=>[g.co])).size;
  const sum=`<span class="summary num"><b>${n}</b> ${state.view==="deals"?"deal"+(n===1?"":"s"):"athlete"+(n===1?"":"s")}</span>`;
  $("#chips").innerHTML=sum+(state.showChips?c.map(([k,l,v])=>`<span class="fc">${l}: <b>${esc(v)}</b><button data-rm="${k}" aria-label="Remove ${l} filter">${I(ICON.x,14)}</button></span>`).join(""):"")+
    (c.length?`<button class="ghost" id="clear">${I(ICON.reset,16)}Clear all</button>`:"")+(c.length?btn:"");
}
function renderControls(){
  const n=activeChips().length;
  $("#fpop").innerHTML=`<button class="btn" id="fbtn" aria-haspopup="true" aria-expanded="${state.menu==="f"}">${I(ICON.sliders,18)}Filters${n?`<span class="badge num">${n}</span>`:""}</button>`+(state.menu==="f"?filterPanel():"");
  $("#spop").innerHTML=`<button class="btn" id="sbtn" aria-haspopup="true" aria-expanded="${state.menu==="s"}">${I(ICON.sort,18)}Sort</button>`+(state.menu==="s"?`<div class="menu" role="menu">${SORTS[state.view].map(([k,l])=>`<button class="mi" role="menuitemradio" aria-checked="${state.sort[state.view]===k}" data-sort="${k}">${l}<span class="chk">${I(ICON.check,16)}</span></button>`).join("")}</div>`:"");
  $("#views").innerHTML=[["deals","Deals",ICON.table],["athletes","By athlete",ICON.users]].map(([k,l,ic])=>`<button aria-pressed="${state.view===k}" data-view="${k}" aria-label="${l}" title="${l}">${I(ic,20)}</button>`).join("")+`<span class="sep"></span><button id="copy" aria-label="Copy as CSV" title="Copy as CSV">${I(ICON.copy,20)}</button>`;
  $("#spark").classList.toggle("ready",!!state.q.trim());
}
function filterPanel(){
  const F=state.f;
  return `<div class="menu fp" role="dialog" aria-label="Filters">
   <div><h3>Deal type</h3><div class="opts">${TYPES.map(t=>`<button class="opt" aria-pressed="${F.types.includes(t)}" data-ft="${t}">${t}</button>`).join("")}</div></div>
   <div><h3>Min athlete stake</h3><div class="opts">${MINS.map(([v,l])=>`<button class="opt" aria-pressed="${F.min===v}" data-fm="${v}">${l}</button>`).join("")}</div></div>
   <div><h3>Since</h3><div class="opts"><button class="opt" aria-pressed="${!F.since}" data-fy="0">Any</button>${YEARS.map(y=>`<button class="opt" aria-pressed="${F.since===y}" data-fy="${y}">${y}</button>`).join("")}</div></div>
   <div><h3>Industry</h3><div class="opts inds">${INDUSTRIES.map(t=>`<button class="opt" aria-pressed="${F.inds.includes(t)}" data-fi="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>
   <div><h3>Amounts</h3><div class="opts"><button class="opt" aria-pressed="${F.disc}" data-fd="1">Disclosed only</button></div></div>
   <div class="row2"><button class="link" data-clear="1">Reset</button><button class="opt" style="background:var(--accent);color:var(--accent-ink)" data-close="1">Done</button></div>
  </div>`;
}
function render(){
  const rows=filtered();
  const n=renderTable(rows);
  renderControls();renderChips(n);
}
function toggleIn(a,v){const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v)}
function commit(){
  const p=parse(state.q),F=state.f;
  p.types.forEach(t=>{if(!F.types.includes(t))F.types.push(t)});
  if(p.min)F.min=p.min;if(p.since)F.since=p.since;
  p.text.forEach(t=>{if(!F.text.includes(t))F.text.push(t)});
  state.q="";$("#q").value="";render();
}
$("#describe").addEventListener("submit",e=>{e.preventDefault();commit()});
$("#q").addEventListener("input",e=>{state.q=e.target.value;const n=renderTable(filtered());renderControls();renderChips(n)});
document.addEventListener("click",e=>{
  const t=e.target,c=s=>t.closest(s);
  const F=state.f;
  if(c("#fbtn")){state.menu=state.menu==="f"?null:"f";return renderControls()}
  if(c("#sbtn")){state.menu=state.menu==="s"?null:"s";return renderControls()}
  let b;
  if(b=c("[data-ft]")){toggleIn(F.types,b.dataset.ft);return render()}
  if(b=c("[data-fm]")){F.min=+b.dataset.fm;return render()}
  if(b=c("[data-fy]")){F.since=+b.dataset.fy;return render()}
  if(b=c("[data-fi]")){toggleIn(F.inds,b.dataset.fi);return render()}
  if(c("[data-fd]")){F.disc=!F.disc;return render()}
  if(c("[data-clear]")||c("#clear")){Object.assign(F,{types:[],inds:[],min:0,disc:false,since:0,text:[]});return render()}
  if(c("[data-close]")){state.menu=null;return renderControls()}
  if(b=c("[data-sort]")){state.sort[state.view]=b.dataset.sort;state.menu=null;return render()}
  if(b=c("[data-rm]")){const k=b.dataset.rm;if(k.startsWith("text:"))F.text.splice(+k.slice(5),1);else if(k==="types"||k==="inds")F[k]=[];else if(k==="disc")F.disc=false;else F[k]=0;return render()}
  if(c("#hide")){state.showChips=!state.showChips;return render()}
  if(b=c("[data-view]")){state.view=b.dataset.view;state.menu=null;state.open.clear();return render()}
  if(c("#copy"))return copyCsv();
  if(c("#gs")){$("#q").focus();return}
  if(c("a"))return;
  if(b=c(".row")){const k=b.dataset.k;state.open.has(k)?state.open.delete(k):state.open.add(k);const y=$(".scroller").scrollTop;renderTable(filtered());$(".scroller").scrollTop=y;const r=[...document.querySelectorAll(".row")].find(r=>r.dataset.k===k);r&&r.focus({preventScroll:true});return}
  if(state.menu&&!c(".pop")){state.menu=null;renderControls()}
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#q").focus();return}
  if(e.key==="Escape"&&state.menu){state.menu=null;renderControls();return}
  const r=e.target.closest&&e.target.closest(".row");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();r.click()}
});
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function copyCsv(){
  const rows=sortDeals(filtered().slice());
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv=[["Company","Athletes","Deal type","Round","Athlete stake","Round size","Valuation","Date","Source"].map(q).join(",")].concat(rows.map(g=>[g.co,g.ath.map(a=>a.name).join("; "),g.type,g.round,g.stake,g.size,g.val,g.date,g.srcs[0]].map(q).join(","))).join("\n");
  const done=()=>toast(`Copied ${rows.length} deals as CSV`);
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=csv;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(_){toast("Copy is blocked in this view")}ta.remove()};
  try{navigator.clipboard.writeText(csv).then(done,fallback)}catch(_){fallback()}
}
document.addEventListener("error",e=>{const im=e.target;if(im.tagName!=="IMG"||!im.dataset.co)return;const w=im.parentNode,n=im.dataset.co;w.classList.add("fb");w.style.background=MONO[Math.abs(hash(n))%MONO.length];w.textContent=(n.replace(/[^A-Za-z0-9]/g,"")[0]||"?").toUpperCase()},true);
render();
</script>
